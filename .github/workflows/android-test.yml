name: Android Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Test and assemble debug APKs
        working-directory: android
        run: bash ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

  device-test:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            runner: ubuntu-latest
            arch: x86_64
          - api-level: 29
            target: default
            runner: ubuntu-latest
            arch: x86_64
          - api-level: 33
            target: default
            runner: ubuntu-latest
            arch: x86_64
          # Use Ubuntu KVM for the API 37 16 KB x86_64 image.
          - api-level: "37.0"
            target: google_apis_ps16k
            runner: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Enable KVM access
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
