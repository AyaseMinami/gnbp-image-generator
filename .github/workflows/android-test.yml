name: Android Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Test and assemble debug APKs
        working-directory: android
        run: bash ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

  device-test:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 37]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run instrumentation tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
