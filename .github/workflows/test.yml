name: Desktop Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "app_info.py"
      - "main.py"
      - "requirements.txt"
      - "build.spec"
      - "config/**"
      - "core/**"
      - "ui/**"
      - "tests/**"
      - "contracts/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "app_info.py"
      - "main.py"
      - "requirements.txt"
      - "build.spec"
      - "config/**"
      - "core/**"
      - "ui/**"
      - "tests/**"
      - "contracts/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
